name: formule_one
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.2 <4.0.0'

dependencies:
  flutter_markdown: ^0.6.18
  font_awesome_flutter: ^10.12.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  google_sign_in: ^6.1.0
  image_picker: ^0.8.7+4
  http: ^1.2.2
  url_launcher: ^6.3.0
  webview_flutter: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  fonts:
    - family: F1Font  
      fonts:
        - asset: assets/fonts/MAIAN.TTF
          weight: 700
  assets:
    - assets/splash.png
    - assets/images/
    - assets/images/tracks/
    - assets/images/pneu/
    - assets/images/circuits/

